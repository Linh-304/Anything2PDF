[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anything2pdf"
version = "0.1.0"
description = "Offline desktop application for converting office documents to PDF."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4,<5",
    "ruff>=0.9,<1",
    "pyright>=1.1,<2",
    "pyinstaller>=6,<7",
]

[project.scripts]
anything2pdf = "anything2pdf.presentation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring LibreOffice or external processes",
    "ui: tests requiring a Qt application environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]